<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!--HEAD-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; background: #08080a; }
  body {
    position: relative; overflow: hidden; color: #e4e4e7;
    font-family: var(--font-sans), sans-serif; -webkit-font-smoothing: antialiased;
  }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgb(255 255 255 / .07) 1px, transparent 1px),
      linear-gradient(90deg, rgb(255 255 255 / .07) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse 80% 90% at 30% 0, #000 25%, transparent 80%);
  }
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(520px 380px at 92% -60px, rgb(167 139 250 / .35), transparent 70%),
      radial-gradient(460px 340px at -40px 520px, rgb(198 244 50 / .16), transparent 70%),
      radial-gradient(420px 320px at 70% 110%, rgb(103 232 249 / .14), transparent 70%);
  }
  .content { position: absolute; left: 72px; top: 64px; width: 640px; }
  .mono { font-family: var(--font-mono), monospace; }
  .eyebrow { font-size: 19px; color: #a1a1aa; letter-spacing: .01em; }
  h1 {
    margin: 22px 0 22px; font-size: 92px; font-weight: 600; line-height: .98; letter-spacing: -.045em;
    color: transparent; background: linear-gradient(180deg, #fff 35%, #9f9fa9); background-clip: text; -webkit-background-clip: text;
  }
  .tag { font-size: 27px; line-height: 1.4; color: #d4d4d8; max-width: 600px; }
  .tag b { color: #c6f432; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
  .chip {
    display: inline-flex; align-items: center; gap: 10px; height: 40px; padding: 0 16px;
    font-size: 17px; border-radius: 999px; color: #d4d4d8;
    background: rgb(255 255 255 / .05); border: 1px solid rgb(255 255 255 / .12);
  }
  .chip.status { color: #c6f432; background: rgb(198 244 50 / .08); border-color: rgb(198 244 50 / .35); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #c6f432; box-shadow: 0 0 0 4px rgb(198 244 50 / .2); }
  .url { position: absolute; left: 72px; bottom: 50px; font-size: 20px; color: #71717a; }
  .url span { color: #e4e4e7; }
  .photo {
    position: absolute; right: 64px; top: 64px; width: 380px; height: 502px; border-radius: 32px; overflow: hidden;
    border: 1px solid rgb(255 255 255 / .14);
    box-shadow: 0 40px 100px -30px rgb(0 0 0 / .9), 0 0 0 8px rgb(255 255 255 / .03);
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; }
  .photo .px { position: absolute; inset: 0; }
  .spark { position: absolute; right: 418px; top: 70px; width: 44px; height: 44px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="content">
    <p class="eyebrow mono">Frontend Engineer · Vue/Nuxt · Angular · React/Next</p>
    <h1>Aleksandr<br />Ovchinnikov</h1>
    <p class="tag"><b>6+ years</b> building fast, scalable web apps — frontend architecture, performance, multi-brand systems.</p>
    <div class="chips mono">
      <span class="chip status"><i class="dot"></i>Open to opportunities</span>
      <span class="chip">Lisbon, PT</span>
      <span class="chip">TypeScript</span>
    </div>
  </div>
  <p class="url mono"><span>ovchinnikov-lxs.github.io</span> · CV · LinkedIn · GitHub</p>
  <div class="photo"><img src="avatar.jpg" alt="" /><div class="px"></div></div>
  <svg class="spark" viewBox="0 0 40 40"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset=".5" stop-color="#67e8f9"/><stop offset="1" stop-color="#c6f432"/></linearGradient></defs><path d="M20 2c1.4 9.4 8.6 16.6 18 18-9.4 1.4-16.6 8.6-18 18-1.4-9.4-8.6-16.6-18-18 9.4-1.4 16.6-8.6 18-18z" fill="url(#g)"/></svg>
  <script src="templates.js"></script>
  <script>dissolve(document.querySelector(".photo .px"), { cell: 16, depth: 4, seed: 11 });</script>
</body>
</html>
